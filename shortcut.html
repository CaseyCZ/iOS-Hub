<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>iOS Hub Source Import</title>
  <style>
    :root{color-scheme:dark light;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d12;color:#f5f7fb}
    main{width:min(560px,calc(100% - 32px));padding:28px;border:1px solid #2a2f3a;border-radius:18px;background:#151923;text-align:center;box-sizing:border-box}
    h1{margin:0 0 10px;font-size:24px}
    p{margin:0 0 18px;color:#aeb6c5;line-height:1.55}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:12px;background:#0a84ff;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>iOS Hub Source Import</h1>
    <p id="status">Opening the shared Shortcut…</p>
    <a id="shortcutLink" href="#" rel="noopener">Open Shortcut</a>
  </main>
  <script type="module">
    import { SOURCE_IMPORT_SHORTCUT } from './src/js/config.js?v=1.1.5-20260930-shortcut2';

    const link = document.getElementById('shortcutLink');
    const status = document.getElementById('status');
    link.href = SOURCE_IMPORT_SHORTCUT.shareURL;
    link.textContent = `Open ${SOURCE_IMPORT_SHORTCUT.name}`;
    status.textContent = `Opening ${SOURCE_IMPORT_SHORTCUT.name}…`;
    window.location.replace(SOURCE_IMPORT_SHORTCUT.shareURL);
  </script>
</body>
</html>
