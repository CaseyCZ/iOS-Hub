name: Audit iOS Hub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "*.html"
      - "*.css"
      - "sources/**"
      - "tools/**"
      - "altstore/**"
      - "sidestore/**"
      - "mix/**"
      - "data/**"
      - ".github/workflows/audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        run: |
          for file in app.js builder.js converter.js i18n.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done

      - name: Check Python syntax
        run: python -m py_compile tools/update_sources.py tools/audit_repo.py

      - name: Validate registry JSON
        run: python -m json.tool sources/registry.json >/dev/null

      - name: Audit repository consistency
        run: python tools/audit_repo.py
