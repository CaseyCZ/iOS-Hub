name: Update iOS sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "sources/registry.json"
      - "tools/update_sources.py"
      - ".github/workflows/update-sources.yml"

permissions:
  contents: write

concurrency:
  group: update-ios-sources
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sources and build packages
        run: python tools/update_sources.py

      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Generated files can race with normal website commits. For every
          # attempt start from the newest main and regenerate instead of
          # rebasing generated timestamps/caches and creating conflicts.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python tools/update_sources.py
            git add data mix sidestore

            if git diff --cached --quiet; then
              echo "No generated changes."
              exit 0
            fi

            git commit -m "Update iOS source cache [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another commit; regenerating on latest main ($attempt/3)..."
            sleep 2
          done

          echo "Unable to push generated source cache after 3 attempts."
          exit 1
